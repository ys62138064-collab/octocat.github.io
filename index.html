<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deepjob · S1–S27 交互原型</title>
<style>
:root{
  --bg:#FBF6F1;
  --card:#FFFFFF;
  --ink:#10132B;
  --ink2:#101330;
  --label:#4A4560;
  --sub:#7A7488;
  --muted:#8A8496;
  --muted2:#A79FB2;
  --line:#EDE2DA;
  --line2:#F0E4DC;
  --accent:#F0563F;
  --accent2:#E0523A;
  --accent3:#FE6A49;
  --chip:#FFF0EA;
  --green:#2E9E7E;
  --grad:linear-gradient(90deg,#FC6B4A 0%,#F04A70 55%,#A83380 100%);
  --grad-diag:linear-gradient(135deg,#FC6B4A 0%,#F04A70 50%,#8C2E7A 100%);
  --stroke-grad:linear-gradient(135deg,#FC6B4A,#F04A70 50%,#8C2E7A);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans TC",sans-serif;
  background:#17131F;color:#fff;overflow:hidden;
}
.app{display:flex;height:100vh;width:100vw}

/* ---------- sidebar ---------- */
.side{
  width:246px;flex:0 0 246px;height:100vh;background:#1F1A29;border-right:1px solid #2C2537;
  display:flex;flex-direction:column;overflow:hidden;
}
.side h1{font-size:14px;font-weight:700;margin:0;padding:20px 20px 4px;letter-spacing:.02em}
.side .sub{font-size:11px;color:#8C84A0;padding:0 20px 14px;line-height:1.6}
.side .list{overflow-y:auto;flex:1;padding:0 10px 16px}
.side .list::-webkit-scrollbar{width:6px}
.side .list::-webkit-scrollbar-thumb{background:#3A3247;border-radius:3px}
.side button{
  display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;cursor:pointer;
  color:#A79FB8;font-family:inherit;font-size:11.5px;padding:7px 10px;border-radius:9px;text-align:left;
}
.side button:hover{background:#2A2338;color:#fff}
.side button.on{background:linear-gradient(90deg,rgba(240,86,63,.22),rgba(168,51,128,.16));color:#fff}
.side button b{font-size:10px;font-weight:600;color:#7E7594;min-width:22px}
.side button.on b{color:#FF9B7A}
.side .reset{margin:10px;padding:10px;border-radius:10px;background:#2A2338;color:#CFC7DE;font-size:11.5px;border:0;cursor:pointer;font-family:inherit}

/* ---------- stage ---------- */
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stage-inner{transform-origin:center center}
.phone{
  width:390px;height:844px;border-radius:44px;position:relative;overflow:hidden;
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  background:#FBF6F1;
}
.hintbar{
  position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11px;color:#7B7391;letter-spacing:.02em;
}

/* ---------- screen ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex;animation:fade .26s ease}
@keyframes fade{from{opacity:0;transform:scale(.994)}to{opacity:1;transform:none}}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:0}

/* ---------- status bar ---------- */
.sb{height:62px;flex:0 0 62px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 12px;font-size:14px;font-weight:600;letter-spacing:.01em}
.sb .icons{display:flex;align-items:center;gap:5px}
.sb svg{display:block}
.sb.bleed{padding-left:0;padding-right:0}
.sb.dark{color:#10132B}
.sb.light{color:#fff}

/* ---------- shared ---------- */
.pad{padding:0 20px}
.pad26{padding:0 26px}
.title{font-size:24px;font-weight:700;color:var(--ink);margin:0}
.title-sm{font-size:17px;font-weight:700;color:var(--ink);margin:0}
.subline{font-size:12px;color:var(--sub);margin:6px 0 0;line-height:1.6}
.label{font-size:11.5px;font-weight:500;color:var(--label);margin:0 0 6px}
.field{height:56px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;padding:0 16px;font-size:14px;color:var(--ink)}
.field.ph{color:#9A94A8}
.field.err{border-color:#F05740}
.btn{height:52px;border-radius:26px;background:var(--grad);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;border:0;width:100%;cursor:pointer;font-family:inherit;letter-spacing:.01em}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--accent);border:1px solid #F5C6B6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:5px 11px;border-radius:100px;font-size:11px;font-weight:500;background:var(--chip);color:var(--accent2);cursor:pointer;border:0;font-family:inherit}
.chip.on{background:var(--accent);color:#fff}
.card{background:#fff;border:1px solid var(--line2);border-radius:16px}
.card-grad{border:1px solid transparent;background:#fff;border-radius:20px;position:relative}
.card-grad::before{content:"";position:absolute;inset:-1px;border-radius:21px;padding:1px;background:linear-gradient(90deg,#FF7DB2,#FFA45C,#A97BFF);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.grow{flex:1;min-width:0}
.center{display:flex;align-items:center;justify-content:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.nav{display:flex;align-items:center;gap:8px;padding:4px 18px 10px 16px}
.nav .t{flex:1;font-size:24px;font-weight:700;color:var(--ink)}
.nav .act{font-size:11px;font-weight:500;color:var(--muted)}
.sec-t{font-size:13px;font-weight:700;color:var(--ink)}
.hr{height:1px;background:var(--line);margin:2px 0}

/* progress */
.progress{display:flex;gap:6px}
.progress i{flex:1;height:5px;border-radius:3px;background:#F1E6DF}
.progress i.on{background:var(--accent3)}

/* tab bar */
.tabbar{flex:0 0 82px;display:flex;background:#fff;padding:12px 21px 21px;gap:0;box-shadow:0 -6px 20px rgba(140,46,122,.06)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer}
.tab.on{color:var(--accent2);font-weight:600}
.tab svg{width:21px;height:21px}

/* home gradient head */
#S1,#S2,#S3,#S4{background:linear-gradient(180deg,#FC6B4A 0%,#F04A70 50%,#8C2E7A 100%)}
.splash,.brand-screen{background:transparent}
.home-top{background:linear-gradient(160deg,#FF7A59,#F04D6E 55%,#B83080);border-radius:0 0 28px 28px;padding:6px 20px 16px;flex:0 0 auto}
.brandrow{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:7px;color:#fff;font-size:20px;font-weight:700}
.pill-loc{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.18);color:#fff;font-size:10.5px;font-weight:500;padding:6px 11px;border-radius:100px}
.searchbar{height:44px;background:#fff;border-radius:24px;display:flex;align-items:center;gap:9px;padding:0 16px;color:#9A94A8;font-size:12.5px}

/* misc */
.dot{width:7px;height:7px;border-radius:50%;background:#F0563F}
.badge{font-size:9.5px;font-weight:600;padding:4px 8px;border-radius:100px;background:#FFEFEF;color:#EC563E}
.note{background:#FFF7F3;border-radius:14px;padding:11px 13px;font-size:10.5px;color:#8A6A5E;line-height:1.62}
.note2{background:#F4F1F8;border-radius:14px;padding:11px 13px;font-size:10.5px;color:#6E6A80;line-height:1.62}
.warn{background:#FFF8EC;border:1px solid #F6E3C0;border-radius:14px;padding:12px 13px}
.warn .wt{font-size:11.5px;font-weight:700;color:#9A6A12;margin-bottom:5px}
.warn .wc{font-size:10.5px;color:#8A6A2C;line-height:1.55}

/* S1 S2 */
.splash{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 30px 40px}
.splash-img{width:100%;height:500px;border-radius:18px;background-size:cover;background-position:center;margin-bottom:16px}
.splash-img.short{height:300px}
.splash h2{font-size:18px;font-weight:700;color:#fff;text-align:center;margin:0 0 8px}
.splash p{font-size:11.5px;color:rgba(255,255,255,.8);text-align:center;margin:0}

/* S3 S4 */
.brand-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px}
.mark128{width:128px;height:128px;border-radius:38px;background-size:cover;background-position:center;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.5);overflow:hidden}
.mark128::after{content:"";position:absolute;inset:0;background:rgba(10,18,41,.42)}
.mark128 svg{position:relative;z-index:1;width:76px;height:76px}
.mark-s3{width:124px;height:124px;display:flex;align-items:center;justify-content:center}
.mark-s3 svg{width:96px;height:96px;color:#fff}
.brand-name{font-size:34px;font-weight:700;color:#fff;margin:22px 0 10px}
.brand-name.big{font-size:40px;margin:26px 0 8px}
.brand-tag{font-size:12px;color:rgba(255,255,255,.72);margin:0}
.brand-tag2{font-size:15px;font-weight:500;color:#fff;margin:0}
.brand-sub{font-size:12.5px;color:rgba(255,255,255,.78);margin:10px 0 0}
.login-pill{margin-top:34px;padding:8px 18px;border-radius:100px;background:rgba(255,255,255,.18);color:#fff;font-size:10.5px;font-weight:500;cursor:pointer;border:0;font-family:inherit}
.absorb{position:absolute;inset:0;cursor:pointer}

/* S6 register */
.checkbox{width:18px;height:18px;border-radius:5px;background:#fff;border:1px solid #D9CFC6;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 18px}
.checkbox.on{background:var(--accent);border-color:var(--accent);color:#fff}
.divider{display:flex;align-items:center;gap:9px;color:#A79FB2;font-size:10.5px}
.divider i{flex:1;height:1px;background:#E9DFD8}
.social{display:flex;gap:10px}
.social .s{flex:1;height:50px;background:#fff;border:1px solid #E9DFD8;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:500;color:#4A4560;cursor:pointer}
.social .s img{width:20px;height:20px;border-radius:6px;object-fit:cover}

/* S9 */
.career{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border:1px solid var(--line2);border-radius:16px;margin-bottom:10px;cursor:pointer}
.career .ic{width:38px;height:38px;border-radius:12px;background-size:cover;background-position:center;flex:0 0 38px}
.career .nm{font-size:12.5px;font-weight:600;color:var(--ink2)}
.career .ds{font-size:10.5px;color:#8A8494;margin-top:3px}
.tick{width:20px;height:20px;border-radius:50%;border:1px solid #E8DED4;display:flex;align-items:center;justify-content:center;flex:0 0 20px;color:#fff}
.tick.on{background:#F0694A;border-color:#F0694A}

/* S11 */
.adcard{margin:14px 20px 0;border-radius:20px;padding:16px;background:linear-gradient(120deg,#FB6A54,#C13E77);color:#fff;position:relative;overflow:hidden;min-height:126px;display:flex;flex-direction:column;justify-content:flex-end}
.adcard .tag{position:absolute;top:14px;left:14px;font-size:9.5px;padding:3px 9px;border-radius:100px;background:rgba(255,255,255,.24)}
.adcard .pg{position:absolute;top:16px;right:14px;font-size:10px;color:rgba(255,255,255,.75)}
.adcard h3{font-size:19px;font-weight:700;margin:0 0 6px}
.adcard p{font-size:11px;color:rgba(255,255,255,.82);margin:0}
.quick{display:flex;justify-content:space-between;padding:18px 20px 4px}
.quick .q{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;font-weight:500;color:var(--label);cursor:pointer;width:66px}
.quick .q i{width:46px;height:46px;border-radius:50%;background-size:cover;background-position:center;border:1px solid #F3CFC0;display:block}
.dimo-card{margin:14px 20px 0;padding:14px;border-radius:20px;position:relative;background:#fff}
.dimo-head{display:flex;align-items:center;gap:10px}
.dimo-head img{width:54px;height:54px;border-radius:16px;object-fit:cover}
.dimo-head .nm{font-size:14px;font-weight:700;color:var(--ink)}
.dimo-head .st{font-size:10.5px;color:var(--muted);margin-top:3px}
.dimo-card .cp{font-size:12.5px;font-weight:500;color:var(--label);line-height:1.5;margin:12px 0 12px}
.btn-sm{height:44px;border-radius:22px;font-size:14px}

/* job card */
.jcard{margin:0 20px 12px;padding:14px;border-radius:18px;position:relative;background:#fff}
.jcard .top{display:flex;gap:11px}
.jcard .lg{width:44px;height:44px;border-radius:14px;background-size:cover;background-position:center;flex:0 0 44px}
.jcard .jt{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.35}
.jcard .jc{font-size:11.5px;color:var(--sub);margin-top:4px}
.jcard .jm{font-size:11.5px;color:var(--muted);margin-top:6px}
.jcard .tags{display:flex;gap:6px;margin-top:9px}
.jcard .tags span{font-size:9.5px;padding:3px 8px;border-radius:6px;background:#FDF0EA;color:#E0523A}
.jcard .pay{font-size:12px;font-weight:600;color:var(--accent2);margin-top:10px}
.jcard .why{font-size:11px;color:#6B5A52;line-height:1.55;margin-top:9px}
.jcard .foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.jcard .match{font-size:10.5px;color:var(--muted)}
.jcard .more{font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer}
.heart{position:absolute;top:14px;right:14px;color:#B9B3A8;cursor:pointer}

/* S13 */
.detail-top{background:linear-gradient(150deg,#FF7A59,#E8456B 60%,#B83080);border-radius:0 0 26px 26px;padding:0 20px 20px;color:#fff}
.detail-top h2{font-size:20px;font-weight:700;margin:6px 0 6px;line-height:1.35}
.detail-top .co{font-size:11.5px;color:rgba(255,255,255,.85)}
.kv{background:#fff;border-radius:14px;padding:12px 14px;margin:12px 20px 0}
.kv div{font-size:11.5px;color:#4A4560;padding:4px 0;line-height:1.6}
.kv .pay{color:var(--accent2);font-weight:500}
.bullet{font-size:11.5px;color:#4A4560;line-height:1.75;white-space:pre-line}
.bottom-bar{flex:0 0 82px;background:#fff;padding:12px 20px 20px;box-shadow:0 -6px 20px rgba(140,46,122,.08)}

/* S15 */
.succ{flex:1;display:flex;flex-direction:column;align-items:center;padding:26px 24px 20px;overflow-y:auto}
.succ-ic{width:76px;height:76px;border-radius:50%;background:#E6F6EF;display:flex;align-items:center;justify-content:center;color:#2E9E7E;margin-bottom:18px}
.succ h2{font-size:21px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.list-card{width:100%;background:#fff;border-radius:18px;padding:14px;margin-top:16px;font-size:11.5px;color:#4A4560;line-height:1.75;white-space:pre-line}

/* chat */
.chat-head{display:flex;align-items:center;gap:10px;padding:2px 18px 11px 16px}
.chat-head img{width:34px;height:34px;border-radius:10px;object-fit:cover}
.chat-head .nm{font-size:13px;font-weight:700;color:var(--ink);line-height:1.2}
.chat-head .st{font-size:9.5px;color:var(--muted);margin-top:2px}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:302px;background:#fff;border:1px solid #F1E7DC;padding:13px;font-size:11.5px;color:#3C3550;line-height:1.72;border-radius:4px 18px 18px 18px}
.bubble.me{align-self:flex-end;background:var(--grad);color:#fff;border:0;border-radius:18px 4px 18px 18px}
.chat-input{flex:0 0 78px;background:#fff;display:flex;align-items:center;gap:9px;padding:12px 16px 22px;box-shadow:0 -6px 20px rgba(140,46,122,.08)}
.chat-input .in{flex:1;height:40px;border-radius:20px;border:1px solid #EDE2DA;background:#fff;display:flex;align-items:center;padding:0 16px;font-size:12px;color:#9A94A8}
.chat-input .rd{width:36px;height:36px;border-radius:18px;background:#F6EFE8;display:flex;align-items:center;justify-content:center;color:#A08C74}
.chat-input .sd{width:36px;height:36px;border-radius:18px;background:#E8A87C;display:flex;align-items:center;justify-content:center;color:#fff}
.quick-reply{display:flex;gap:7px;flex-wrap:wrap}
.quick-reply span{font-size:10.5px;color:#6E6A80;background:#fff;border:1px solid #EFE3D9;padding:7px 11px;border-radius:100px}

/* S17 tabs */
.seg{display:flex;background:#F1EAE4;border-radius:100px;padding:4px;gap:2px}
.seg div{flex:1;text-align:center;font-size:11.5px;padding:9px 0;border-radius:100px;color:#8A8496;cursor:pointer}
.seg div.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 3px 8px rgba(140,64,77,.1)}
.course{margin:0 20px 10px;padding:14px;border-radius:20px;background:#fff;display:flex;gap:12px;cursor:pointer;border:1px solid #F3E7DE}
.course .cv{width:64px;height:64px;border-radius:14px;background-size:cover;background-position:center;flex:0 0 64px}
.course .cn{font-size:13px;font-weight:700;color:var(--ink);line-height:1.4}
.course .cm{font-size:10.5px;color:var(--muted);margin-top:5px}
.pbar{height:5px;border-radius:3px;background:#F1E6DF;margin-top:9px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--grad)}
.course .pf{font-size:10px;color:var(--muted);text-align:right;margin-top:5px}

/* S19 */
.mood{display:flex;gap:8px;flex-wrap:wrap}
.mood span{font-size:11px;font-weight:500;color:#E0523A;background:#FFF0EA;padding:7px 13px;border-radius:100px;cursor:pointer}
.tile{width:calc(50% - 5px);background:#fff;border:1px solid #F0E4DC;border-radius:16px;padding:13px 14px;cursor:pointer}
.tile .tt{font-size:12px;font-weight:600;color:var(--ink)}
.tile .td{font-size:10.5px;color:var(--muted);margin-top:4px}

/* S21 posts */
.post{margin:0 20px 12px;background:#fff;border-radius:18px;padding:14px}
.post .ph{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.post .ph img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.post .ph .pn{font-size:12px;font-weight:600;color:var(--ink)}
.post .ph .pt{font-size:10px;color:var(--muted);margin-top:2px}
.post .pc{font-size:11.5px;color:#3C3550;line-height:1.72}
.post .pics{display:flex;gap:6px;margin-top:10px}
.post .pics i{flex:1;height:78px;border-radius:10px;background-size:cover;background-position:center;display:block}
.post .acts{display:flex;gap:18px;margin-top:11px;font-size:10.5px;color:var(--muted)}

/* S22 */
.stat{flex:1;text-align:center}
.stat .n{font-size:19px;font-weight:700;color:var(--ink)}
.stat .l{font-size:10px;color:var(--muted);margin-top:3px}
.appc{margin:0 20px 10px;background:#fff;border-radius:16px;padding:14px}
.appc .ah{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.appc .at{font-size:12.5px;font-weight:700;color:var(--ink)}
.appc .ac{font-size:10.5px;color:var(--muted);margin-top:4px}
.appc .tl{font-size:10.5px;color:#6B6478;line-height:1.8;margin-top:9px;white-space:pre-line}
.appc .rm{font-size:10.5px;color:#9A6A12;background:#FFF8EC;border-radius:8px;padding:7px 9px;margin-top:9px}

/* S25 */
.profile{margin:4px 20px 0;background:#fff;border-radius:20px;padding:16px}
.av-me{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FFB1A0,#E0567E);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:0 0 56px}
.av-sm{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FFB1A0,#E0567E);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 34px}
.profile .nm{font-size:16px;font-weight:700;color:var(--ink)}
.profile .sc{font-size:11px;color:var(--sub);margin-top:4px}

/* ---------------- build ---------------- */
const ORDER = [
  ['S1','开场动画 A'],['S2','开场动画 B'],['S3','开场动画 C'],['S4','启动画面'],['S5','登录'],
  ['S6','注册'],['S7','引导① 学历'],['S8','引导② 技能'],['S9','求职意愿'],['S10','引导③ 意愿'],
  ['S11','首页'],['S12','搜索结果'],['S13','职位详情'],['S14','申请确认'],['S15','申请成功'],
  ['S16','DIMOO 对话'],['S17','就业课堂'],['S18','课程详情'],['S19','情绪充电站'],['S20','奶糯小羊对话'],
  ['S21','我的动态'],['S22','申请状态'],['S23','已储存职位'],['S24','讯息'],['S25','我的'],
  ['S26','职涯发展报告'],['S27','设定']
];

const phone = document.getElementById('phone');
phone.innerHTML = ORDER.map(function(o){
  return '<section class="screen" id="'+o[0]+'" data-name="'+o[1]+'">'+S[o[0]]+'</section>';
}).join('');

const idx = document.getElementById('idx');
idx.innerHTML = ORDER.map(function(o,i){
  return '<button data-jump="'+o[0]+'"><b>S'+(i+1)+'</b><span>'+o[1]+'</span></button>';
}).join('');

/* ---------------- navigation ---------------- */
let current = null;
let stack = [];
const screens = Array.from(document.querySelectorAll('.screen'));

function show(id, push){
  const el = document.getElementById(id);
  if(!el) return;
  if(current && current !== id && push !== false){ stack.push(current); }
  screens.forEach(function(s){ s.classList.remove('on'); });
  el.classList.add('on');
  el.querySelectorAll('.scroll, .chat-body, .succ').forEach(function(b){ b.scrollTop = 0; });
  current = id;
  document.querySelectorAll('#idx button').forEach(function(b){
    b.classList.toggle('on', b.dataset.jump === id);
  });
}
function go(id){ show(id, true); }
function back(){ const p = stack.pop(); show(p || 'S11', false); }
window.restart = function(){ stack.length = 0; show('S1', false); };

phone.addEventListener('click', function(e){
  const jump = e.target.closest('[data-jump]');
  const backEl = e.target.closest('[data-back]');
  const goEl = e.target.closest('[data-go]');
  if(backEl){ e.stopPropagation(); back2(backEl.dataset.back); return; }
  if(goEl){ e.stopPropagation();
    if(goEl.id === 'btnCreate'){
      const cb = document.getElementById('cbTerms');
      if(cb && !cb.classList.contains('on')){ cb.style.boxShadow='0 0 0 3px rgba(240,86,63,.25)'; setTimeout(function(){cb.style.boxShadow='';},700); }
    }
    go(goEl.dataset.go); return;
  }
});
function back2(id){ show(id, false); }

/* chips toggle */
phone.addEventListener('click', function(e){
  const chip = e.target.closest('.chip');
  if(chip && !chip.closest('[data-go]') && chip.textContent.indexOf('×')<0) chip.classList.toggle('on');
  const box = e.target.closest('.checkbox');
  if(box){ box.classList.toggle('on'); if(box.classList.contains('on')) box.innerHTML='<svg viewBox="0 0 24 24" width="11" height="11"><path d="M4 12.5 9.5 18 20 6.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'; else box.innerHTML=''; }
  const career = e.target.closest('.career');
  if(career){ const t = career.querySelector('.tick'); t.classList.toggle('on'); }
  const opt = e.target.closest('.opt');
  if(opt){ opt.parentNode.querySelectorAll('.opt').forEach(function(o){o.classList.remove('on');}); opt.classList.add('on'); }
  const sw = e.target.closest('.switch');
  if(sw) sw.classList.toggle('on');
});

idx.addEventListener('click', function(e){
  const b = e.target.closest('[data-jump]');
  if(b){ stack.length = 0; show(b.dataset.jump, false); }
});

/* scale */
function fit(){
  const stage = document.querySelector('.stage');
  const inner = document.getElementById('stageInner');
  const w = stage.clientWidth, h = stage.clientHeight;
  const s = Math.min((w - 120) / 390, (h - 90) / 844, 1);
  inner.style.transform = 'scale(' + s + ')';
}

/* auto play intro */
let introTimer = null;
function playIntro(){
  clearTimeout(introTimer);
  introTimer = setTimeout(function(){ if(current==='S1') show('S2'); },1400);
  setTimeout(function(){ if(current==='S2') show('S3'); },3000);
  setTimeout(function(){ if(current==='S3') show('S4'); },4400);
}

window.addEventListener('resize', fit);
fit();
const startHash = (location.hash || '').replace('#', '');
if(startHash && S[startHash]){ show(startHash, false); }
else { show('S1', false); playIntro(); }
</script>
